<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAIN BOY</title>
  <meta name="description" content="GAIN BOY — Game Boy music game." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <header class="hero">
    <p class="byline">Game Boy · v1.0</p>
    <h1 class="brand">GAIN&nbsp;BOY</h1>
  </header>

  <main class="stage">
    <div class="cabinet">
      <div class="bezel">
        <div id="game"></div>
      </div>
      <p class="hint">Click the game, then use keyboard or on-screen buttons.</p>
      <p class="hint"><a class="rom-dl" href="rom/gainboy.gb" download="gainboy.gb">Download ROM</a></p>
    </div>

    <section class="controls" aria-label="Controls">
      <h2>Controls</h2>
      <ul>
        <li><kbd>←</kbd><kbd>→</kbd> Walk</li>
        <li><kbd>Z</kbd> Jump (A) · double-tap for pads</li>
        <li><kbd>X</kbd> Hold = 16ths (B)</li>
        <li><kbd>↓</kbd> Breakdown / hold note</li>
        <li><kbd>↑</kbd> Octave up</li>
        <li><kbd>Enter</kbd> Start / pause</li>
        <li><kbd>Shift</kbd> Select / loop</li>
      </ul>
    </section>
  </main>

  <footer class="foot">
    <p>Ben Wager · <a href="https://emulatorjs.org/">EmulatorJS</a></p>
  </footer>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "gb";
    window.EJS_gameName = "GAIN BOY";
    window.EJS_gameUrl = "rom/gainboy.gb";
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = true;
    window.EJS_color = "#306230";
    window.EJS_backgroundColor = "#0f380f";
    // Classic DMG-01 green LCD
    window.EJS_defaultOptions = {
      gambatte_gb_colorization: "internal",
      gambatte_gb_internal_palette: "GB - DMG"
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
